# laptop selfhost, no autostart on purpose — run it when you need it
# usage: docker compose -f selfhost/docker-compose.yml --env-file selfhost/.env up -d
# stop:  docker compose -f selfhost/docker-compose.yml down   (data stays in volume)

services:
  linkding:
    image: sissbruecker/linkding:1.47.0
    container_name: linkding
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      # keep it sqlite for laptop, less moving parts
      - LD_DB_ENGINE=sqlite
    volumes:
      - linkding-data:/etc/linkding/data
    ports:
      - "${LINKDING_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  linkding-data:
    name: linkding-data
